<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الاحترافية | AMIR FAYEZ</title>
    <link rel="icon" href="images/profile.jpg.jpeg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #FDFBF7; padding: 40px 20px; color: #121212; }
        .admin-container { max-width: 820px; margin: 0 auto; background: #FFF; padding: 35px; border-radius: 14px; border: 3px solid #556B2F; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #556B2F; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #121212; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #556B2F; border-radius: 8px; font-size: 1rem; background: #FDFBF7; }
        .lang-group { border: 1px dashed #556B2F; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: rgba(85, 107, 47, 0.03); }
        .lang-group h3 { margin-bottom: 10px; color: #556B2F; font-size: 1.1rem; }
        button.submit-btn { background: #121212; color: #FFF; border: 2px solid #556B2F; padding: 14px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2rem; transition: 0.3s; }
        button.submit-btn:hover { background: #556B2F; }
        button.submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .back-link { display: block; text-align: center; margin-top: 25px; color: #556B2F; text-decoration: none; font-weight: bold; font-size: 1.1rem; }

        .projects-table-section { margin-top: 50px; border-top: 2px solid #556B2F; padding-top: 30px; }
        .project-row-item { display: flex; justify-content: space-between; align-items: center; gap: 15px; background: #FDFBF7; border: 1px solid #556B2F; padding: 15px; border-radius: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .project-row-info h4 { margin-bottom: 5px; color: #121212; }
        .project-row-info p { font-size: 0.85rem; color: #556B2F; word-break: break-all; }
        .delete-btn { background: #b22222; color: #FFF; border: none; padding: 9px 18px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .delete-btn:hover { background: #8b0000; }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; color: #556B2F; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>لوحة تحكم المشاريع السحابية</h1>

        <form id="projectForm">
            <div class="form-group">
                <label>رابط معاينة المشروع</label>
                <input type="text" id="pLink" placeholder="https://..." required>
            </div>

            <div class="form-group">
                <label>رابط الصورة البصرية (مثلاً: images/logo.png.jpeg)</label>
                <input type="text" id="pImg" placeholder="images/logo.png.jpeg" required>
            </div>

            <div class="form-group">
                <label>التقنيات المستخدمة (مفصولة بفاصلة مثل: HTML, CSS, JavaScript)</label>
                <input type="text" id="pTech" placeholder="HTML, CSS, JavaScript" required>
            </div>

            <div class="lang-group">
                <h3>العربية (Arabic)</h3>
                <input type="text" id="titleAr" placeholder="عنوان المشروع بالعربية" style="margin-bottom:10px;" required>
                <textarea id="descAr" rows="2" placeholder="وصف المشروع بالعربية" required></textarea>
            </div>

            <div class="lang-group">
                <h3>الإنجليزية (English)</h3>
                <input type="text" id="titleEn" placeholder="Project Title in English" style="margin-bottom:10px;" required>
                <textarea id="descEn" rows="2" placeholder="Project Description in English" required></textarea>
            </div>

            <div class="lang-group">
                <h3>الألمانية (Deutsch)</h3>
                <input type="text" id="titleDe" placeholder="Projekttitel auf Deutsch" style="margin-bottom:10px;" required>
                <textarea id="descDe" rows="2" placeholder="Projektbeschreibung auf Deutsch" required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="saveBtn">حفظ ونشر المشروع للجميع</button>
            <div class="status-msg" id="statusMsg"></div>
        </form>

        <div class="projects-table-section">
            <h2>المشاريع المنشورة حالياً على قاعدة البيانات</h2>
            <div id="adminProjectsList">
                <p style="text-align:center; color:#556B2F;">جاري تحميل المشاريع...</p>
            </div>
        </div>

        <a href="index.html" class="back-link">الذهاب للموقع الرئيسي ⟵</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmswnjfofyhmrazkmrif.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6Qop3p-b_EqSXwQ44Kq-Lw_Zvay78y4';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function renderAdminProjects() {
            const listContainer = document.getElementById('adminProjectsList');

            const { data: projects, error } = await db
                .from('projects')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                listContainer.innerHTML = `<p style="text-align:center; color:#b22222;">حدث خطأ أثناء تحميل المشاريع: ${error.message}</p>`;
                return;
            }

            listContainer.innerHTML = '';

            if (!projects || projects.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#556B2F;">لا توجد مشاريع مضافة في قاعدة البيانات حالياً.</p>';
                return;
            }

            projects.forEach((p) => {
                const item = document.createElement('div');
                item.className = 'project-row-item';
                item.innerHTML = `
                    <div class="project-row-info">
                        <h4>${p.title_ar}</h4>
                        <p>${p.link}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteProject('${p.id}')">حذف</button>
                `;
                listContainer.appendChild(item);
            });
        }

        async function deleteProject(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المشروع نهائياً؟ سيختفي لجميع الزوار.')) return;

            const { error } = await db
                .from('projects')
                .delete()
                .eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
                return;
            }

            await renderAdminProjects();
            alert('تم حذف المشروع بنجاح!');
        }

        document.getElementById('projectForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const saveBtn = document.getElementById('saveBtn');
            const statusMsg = document.getElementById('statusMsg');
            saveBtn.disabled = true;
            statusMsg.innerText = 'جاري حفظ المشروع على قاعدة البيانات...';

            const newProject = {
                link: document.getElementById('pLink').value.trim(),
                img: document.getElementById('pImg').value.trim(),
                tech: document.getElementById('pTech').value.trim(),
                title_ar: document.getElementById('titleAr').value.trim(),
                desc_ar: document.getElementById('descAr').value.trim(),
                title_en: document.getElementById('titleEn').value.trim(),
                desc_en: document.getElementById('descEn').value.trim(),
                title_de: document.getElementById('titleDe').value.trim(),
                desc_de: document.getElementById('descDe').value.trim()
            };

            const { error } = await db
                .from('projects')
                .insert([newProject]);

            saveBtn.disabled = false;

            if (error) {
                statusMsg.style.color = '#b22222';
                statusMsg.innerText = 'حدث خطأ أثناء الحفظ: ' + error.message;
                return;
            }

            statusMsg.style.color = '#556B2F';
            statusMsg.innerText = 'تم حفظ ونشر المشروع بنجاح وسيظهر للجميع فوراً!';
            document.getElementById('projectForm').reset();
            await renderAdminProjects();
        });

        window.onload = function() {
            renderAdminProjects();
        };
    </script>
</body>
</html>
